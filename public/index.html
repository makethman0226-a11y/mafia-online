<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101827"><title>MAFIA ONLINE</title><link rel="stylesheet" href="/style.css"></head>
<body><main class="wrap"><header><div class="mark">M</div><div><h1>MAFIA ONLINE</h1><p>진실과 거짓이 교차하는 밤</p></div><span class="online">ONLINE</span></header>
<section id="home" class="panel"><h2>게임 입장</h2><label>닉네임<input id="name" maxlength="18" placeholder="게임에서 사용할 닉네임"></label><button id="solo" class="quick">AI 대련 모드 · 혼자 연습하기</button><button id="quick" class="quick">빠른 참가 · 모르는 사람과 게임</button><button id="create">방 만들기</button><div class="join"><input id="code" maxlength="6" placeholder="방 코드"><button id="join">참가하기</button></div><p class="hint">AI 대련은 혼자 바로 시작! 온라인은 6~15명이 함께 플레이합니다.</p></section>
<section id="game" class="hidden"><div class="bar"><span id="room"></span><span id="phase"></span><span id="timer"></span><div class="chat-shortcuts"><button id="publicChatToggle" class="chat-icon" aria-label="전체 대화 열기" title="전체 대화">💬</button><button id="teamChatToggle" class="chat-icon evil-icon hidden" aria-label="악인팀 대화 열기" title="악인팀 대화">☠</button></div></div><div class="panel"><div class="roleline"><div class="role-identity"><div id="roleIllustration" class="role-illustration" aria-hidden="true"></div><div><small>나의 직업</small><h2 id="role">대기 중</h2></div></div><strong id="team"></strong></div><p id="notice">방에 입장했습니다.</p><div id="players" class="players"></div><div id="controls"></div></div>
<div class="panel"><h3>게임 기록</h3><div id="log" class="log"></div></div>
<div id="chatPanel" class="panel chat-panel hidden"><div class="chat-heading"><h3 id="chatTitle">전체 대화</h3><button id="closeChat" class="secondary">닫기</button></div><div id="chat" class="chat"></div><div class="join"><input id="message" maxlength="160" placeholder="메시지 입력"><button id="send">전송</button></div></div></section>
<div id="voteResultOverlay" class="vote-result-overlay hidden" role="dialog" aria-live="assertive"><div id="voteResultText" class="vote-result-text"></div></div><p id="error" class="error"></p><footer>MAFIA ONLINE · 개인정보를 채팅에 쓰지 마세요.</footer></main><script src="/socket.io/socket.io.js"></script><script src="/client.js"></script></body></html>
